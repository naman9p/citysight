# CitySight — Phase 1 ANPR Engine
# Central configuration for thresholds and paths.
# Values are placeholders for Step 1; later steps will use them.

video:
  # Path to a single input video, or a directory of videos.
  input_path: "inputs/videos/sample.mp4"
  camera_id: "cam_01"
  # Target frames processed per second. If this is >= the source FPS,
  # every frame is processed.
  process_fps: 5
  # Optional resize for processing; null keeps original size.
  resize_width: null
  resize_height: null
  # Optional recorded-video start time. When set, canonical observation
  # timestamps become video_start_time + the best crop's position in the video
  # (normalized to UTC). null keeps the Phase 1 processing-time behavior.
  # Must be a timezone-aware ISO-8601 value, e.g. "2026-08-31T10:00:00+05:30"
  # or "2026-08-31T04:30:00Z". Naive values are rejected.
  start_time: null

# Optional: multi-camera recorded-video replay (Step 19).
# When this list is present and non-empty, `python -m phase1_anpr.demo` replays
# each source in order into the SAME stores instead of the single `video` above.
# Each source gets its own camera_id + source_id, and source_id is folded into
# the deterministic event id so identical track ids from different videos never
# collide. Omit or leave empty to keep the single-video behavior unchanged.
#   - camera_id defaults to video.camera_id when not given
#   - source_id defaults to the video file name (stem) when not given
#   - start_time defaults to video.start_time when not given
# sources:
#   - video: "inputs/videos/cam_01_morning.mp4"
#     camera_id: "cam_01"
#     source_id: "cam_01_morning"
#     start_time: "2026-08-31T08:00:00+05:30"
#   - video: "inputs/videos/cam_02_morning.mp4"
#     camera_id: "cam_02"
#     source_id: "cam_02_morning"
#     start_time: "2026-08-31T08:00:00+05:30"

detection:
  # YOLO weights used for license plate detection (loaded in a later step).
  weights_path: "weights/plate_detector.pt"
  # cpu or cuda
  device: "cpu"
  confidence_threshold: 0.35
  iou_threshold: 0.45
  # Class id for "license plate" in the detector.
  plate_class_id: 0
  image_size: 640

tracking:
  # ByteTrack parameters.
  tracker: "bytetrack"
  track_high_threshold: 0.5
  track_low_threshold: 0.1
  new_track_threshold: 0.6
  track_buffer: 30
  match_threshold: 0.8

quality:
  # Best-frame selection thresholds.
  min_plate_width: 60
  min_plate_height: 20
  # Laplacian variance floor for sharpness (blur rejection).
  min_sharpness: 100.0
  # Reference plate area (px) that scores ~1.0 on the size factor.
  target_area: 8000
  # Number of top crops kept per track.
  top_k: 3
  # Weights for the individual factors (need not sum to 1; normalized).
  sharpness_weight: 0.4
  size_weight: 0.3
  brightness_weight: 0.15
  contrast_weight: 0.15

preprocessing:
  # Plate crop preparation before OCR.
  grayscale: true
  # Upscale small crops to this height (px) for OCR.
  target_height: 48
  denoise: false
  clahe: true

ocr:
  engine: "paddleocr"
  device: "cpu"
  language: "en"
  min_char_confidence: 0.4
  # Expected plate length bounds (used for sanity checks).
  min_plate_length: 4
  max_plate_length: 12

confidence:
  # Multi-frame fusion and final confidence gating.
  min_observations: 2
  # Composite score >= accept_threshold (and valid format) -> accepted.
  accept_threshold: 0.6
  # Composite score >= review_threshold -> review; below -> abstained.
  review_threshold: 0.4
  # Weights for the composite confidence (need not sum to 1; normalized).
  ocr_weight: 0.35
  quality_weight: 0.15
  detector_weight: 0.15
  support_weight: 0.15
  validity_weight: 0.2

output:
  plates_dir: "outputs/plates"
  annotated_dir: "outputs/annotated"
  observations_dir: "outputs/observations"
  observations_file: "outputs/observations/observations.jsonl"
  # Save annotated frames/video for debugging.
  save_annotated: true
  # Preserve original (unmodified) plate crops.
  save_plate_crops: true

persistence:
  # Default is a local sqlite DB (no service needed). For the SIH demo this can
  # be swapped for a Postgres repository behind the same interface.
  db_path: "outputs/observations/observations.db"
  # Local evidence store base dir; swappable for MinIO/S3 later.
  evidence_dir: "outputs/plates/evidence"

# Phase 2 cross-camera trajectory reconstruction (Step 20). Read by
# TrajectoryReconstructor.from_config; module defaults apply if omitted.
trajectory:
  # Consecutive sightings of the same plate at the SAME camera within this many
  # seconds are collapsed into one camera visit (one physical pass).
  duplicate_window_seconds: 30
  # Safety cap on observation rows read per trajectory query. The store returns
  # newest-first, so reaching the cap flags the result as truncated.
  max_observations: 500

models:
  model_version: "phase1-anpr-0.1.0"
  detector_name: "yolo-plate"
  ocr_name: "paddleocr"

normalization:
  # Characters allowed in a plate after cleanup (everything else is dropped).
  allowed_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  # Named regex patterns tried in order; first match wins.
  patterns:
    standard: "^[A-Z]{2}[0-9]{1,2}[A-Z]{1,2}[0-9]{4}$"
    bh_series: "^[0-9]{2}BH[0-9]{4}[A-Z]{1,2}$"
  # Valid state / UT RTO codes for confident state extraction on standard plates.
  valid_state_codes:
    - AN
    - AP
    - AR
    - AS
    - BR
    - CG
    - CH
    - DD
    - DL
    - DN
    - GA
    - GJ
    - HP
    - HR
    - JH
    - JK
    - KA
    - KL
    - LA
    - LD
    - MH
    - ML
    - MN
    - MP
    - MZ
    - NL
    - OD
    - PB
    - PY
    - RJ
    - SK
    - TN
    - TR
    - TS
    - UK
    - UP
    - WB
